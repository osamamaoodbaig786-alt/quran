<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran_Learn Suite // Error Detection & Learning</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --panel-bg: #111e3c;
            --border-color: #1e3a6e;
            --text-main: #e2e8f0;
            --accent-color: #38bdf8;
            --card-bg: #132247;
            --hover-bg: #1e3a6e;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #1e293b;
            --accent-color: #0284c7;
            --card-bg: #f1f5f9;
            --hover-bg: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .left-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle-btn {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .logo {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .action-btn:hover {
            border-color: var(--accent-color);
            background: var(--hover-bg);
        }

        .status {
            font-size: 0.8rem;
            color: #4ade80;
            font-weight: 600;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 57px);
            position: relative;
            overflow: hidden;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
        }

        aside {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 200;
        }

        .sidebar-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 12px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-sidebar-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .search-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 15px;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        .sidebar-list-container {
            flex: 1;
            overflow-y: auto;
        }

        .surah-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .surah-btn:hover, .surah-btn.active {
            background-color: var(--hover-bg);
            border-color: var(--accent-color);
        }

        .arabic-name-sm {
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
        }

        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            width: 100%;
        }

        .top-bar-controls {
            margin-bottom: 20px;
            background: var(--panel-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .top-bar-dropdown {
            flex: 1;
            min-width: 250px;
        }

        .top-bar-dropdown select {
            width: 100%;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .font-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .surah-header-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .surah-info h2 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
        }

        .surah-meta {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .surah-arabic-title {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            color: var(--accent-color);
        }

        .bismillah-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            margin-bottom: 20px;
            word-break: break-word;
        }

        .ayah-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.2s;
        }

        .ayah-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .ayah-number {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .bookmark-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #94a3b8;
            transition: color 0.2s;
            padding: 0 5px;
        }

        .bookmark-btn.bookmarked {
            color: #f59e0b;
        }

        .ayah-arabic {
            font-family: 'Amiri', serif;
            font-size: var(--arabic-font-size, 1.8rem);
            text-align: right;
            direction: rtl;
            margin-bottom: 15px;
            line-height: 2.3;
            word-wrap: break-word;
        }

        .ayah-arabic span.word {
            display: inline-block;
            padding: 0 4px;
            margin: 0 2px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .ayah-arabic span.word.error-highlight {
            border: 2px solid #f87171 !important;
            background-color: rgba(248, 113, 113, 0.25) !important;
            color: #fca5a5 !important;
            border-radius: 50% !important;
            padding: 2px 8px !important;
        }

        .feedback-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .error-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(248, 113, 113, 0.1);
            border-left: 3px solid #f87171;
            border-radius: 4px;
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pronunciation-tip {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 2px;
        }

        .ayah-translation {
            font-size: var(--translation-font-size, 0.95rem);
            color: var(--text-main);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            text-align: right;
            margin-bottom: 15px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .audio-player-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 6px;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .play-btn {
            background: var(--accent-color);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0b1329;
            flex-shrink: 0;
        }

        .time-info {
            font-size: 0.8rem;
            color: #94a3b8;
            min-width: 75px;
        }

        .progress-bar-container {
            flex: 1;
            min-width: 120px;
            background: var(--bg-color);
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
        }

        .progress-bar-fill {
            background: var(--accent-color);
            width: 0%;
            height: 100%;
            border-radius: 3px;
        }

        .voice-rec-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mic-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .mic-btn {
            background: #10b981;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #ffffff;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .mic-btn:hover {
            background: #059669;
        }

        .rec-result {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin: 0;
            line-height: 1.5;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        /* --- Mobile Responsive Rules --- */
        @media (max-width: 768px) {
            .menu-toggle-btn {
                display: inline-block;
            }

            .status {
                display: none;
            }

            .logo {
                font-size: 0.85rem;
            }

            header {
                padding: 10px 15px;
            }

            aside {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                transform: translateX(-100%);
                box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            }

            aside.open {
                transform: translateX(0);
            }

            .close-sidebar-btn {
                display: block;
            }

            .sidebar-overlay.open {
                display: block;
            }

            .main-content {
                padding: 15px;
            }

            .surah-header-card {
                flex-direction: column;
                align-items: flex-start;
            }

            .surah-arabic-title {
                align-self: flex-end;
            }

            .top-bar-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .font-controls {
                justify-content: flex-end;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>

                <div class="loading">سورت کا ڈیٹا لوڈ ہو رہا ہے...</div>

        </main>
    </div>

        function initApp() {
            renderSidebar(surahNamesList);

            const dropdown = document.getElementById('surahDropdown');
            dropdown.innerHTML = '';
            surahNamesList.forEach(surah => {

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
        }

        function renderSidebar(list) {
            const sidebarList = document.getElementById('sidebar-list');
            sidebarList.innerHTML = '';
            list.forEach(surah => {
                const btn = document.createElement('button');
                btn.className = `surah-btn ${surah.id === selectedSurahId ? 'active' : ''}`;
                btn.onclick = () => {
                    selectSurah(surah.id);
                    if (window.innerWidth <= 768) closeSidebar();
                };
                btn.innerHTML = `<span>${surah.id}. ${surah.name}</span> <span class="arabic-name-sm">${surah.arabic}</span>`;
                sidebarList.appendChild(btn);
            });
        }

        function filterSurahs(query) {
            const q = query.toLowerCase();
            const filtered = surahNamesList.filter(s => 
                s.name.toLowerCase().includes(q) || 
                s.arabic.includes(q) || 
                s.id.toString() === q
            );
            renderSidebar(filtered);
        }

        function selectSurah(id) {
            selectedSurahId = id;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            document.querySelectorAll('.surah-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.onclick.toString().includes(`selectSurah(${id})`)) {
                    btn.classList.add('active');
                }
            });

            document.getElementById('surahDropdown').value = id;
            loadSurahContent(id);
        }

        function handleDropdownChange(id) {
            selectSurah(parseInt(id));
        }

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        function adjustFontSize(delta) {
            arabicFontSize = Math.max(1.2, Math.min(3.0, arabicFontSize + delta * 0.2));
            document.querySelectorAll('.ayah-arabic').forEach(el => {
                el.style.fontSize = `${arabicFontSize}rem`;
            });
        }

        function toggleBookmark(surahId, ayahNo, arabicText) {
            const index = bookmarks.findIndex(b => b.surahId === surahId && b.ayahNo === ayahNo);
            if (index > -1) {
                bookmarks.splice(index, 1);
            } else {
                bookmarks.push({ surahId, ayahNo, arabicText });
            }
            localStorage.setItem('quran_bookmarks', JSON.stringify(bookmarks));
            updateBookmarkCount();
            
            const btn = document.getElementById(`bm-btn-${surahId}-${ayahNo}`);
            if (btn) {
                btn.classList.toggle('bookmarked');
                btn.textContent = btn.classList.contains('bookmarked') ? '★' : '☆';
            }

            let listText = "محفوظ شدہ آیات (Bookmarks):\n\n";
            bookmarks.forEach(b => {
                const sInfo = surahNamesList.find(s => s.id === b.surahId);
                listText += `• Surah ${sInfo.name} (Ayat ${b.ayahNo}): ${b.arabicText.substring(0, 30)}...\n`;

        async function loadSurahContent(id) {
            const surahMetaInfo = surahNamesList.find(s => s.id === parseInt(id));
            
            document.getElementById('surahName').textContent = `${surahMetaInfo.id}. ${surahMetaInfo.name}`;
            document.getElementById('surahArabicName').textContent = surahMetaInfo.arabic;
            document.getElementById('surahMeta').textContent = `Loading verses...`;

            const ayahsContainer = document.getElementById('ayahs-container');
            ayahsContainer.innerHTML = '<div class="loading">آیات لوڈ ہو رہی ہیں...</div>';

            const bismillahBox = document.getElementById('bismillahBox');
            if (surahMetaInfo.id === 9) {
                bismillahBox.style.display = 'none';
            } else {
                bismillahBox.style.display = 'block';
                bismillahBox.textContent = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
            }

            const cacheKey = `surah_cache_${id}`;
            let arabicAyahs, urduAyahs;

            if (localStorage.getItem(cacheKey)) {
                const cachedData = JSON.parse(localStorage.getItem(cacheKey));
                arabicAyahs = cachedData.arabic;
                urduAyahs = cachedData.urdu;
                renderAyahs(id, surahMetaInfo, arabicAyahs, urduAyahs);
            } else {
                try {
                    const response = await fetch(`https://api.alquran.cloud/v1/surah/${id}/editions/quran-uthmani,ur.jalandhry`);
                    const data = await response.json();

                    if (data.code === 200) {
                        arabicAyahs = data.data[0].ayahs;
                        urduAyahs = data.data[1].ayahs;
                        
                        localStorage.setItem(cacheKey, JSON.stringify({ arabic: arabicAyahs, urdu: urduAyahs }));
                        renderAyahs(id, surahMetaInfo, arabicAyahs, urduAyahs);
                    }
                } catch (error) {
                    ayahsContainer.innerHTML = '<div class="loading" style="color:#f87171;">انٹرنیٹ کنکشن نہیں ہے یا ڈیٹا لوڈ نہیں ہو سکا۔ براہ کرم کنکشن چیک کریں۔</div>';
                }
            }
        }

        function renderAyahs(id, surahMetaInfo, arabicAyahs, urduAyahs) {
            const ayahsContainer = document.getElementById('ayahs-container');
            document.getElementById('surahMeta').textContent = `Total Verses: ${arabicAyahs.length} | Type: ${surahMetaInfo.type}`;
            ayahsContainer.innerHTML = '';

            arabicAyahs.forEach((ayah, index) => {
                const i = index + 1;
                const paddedSurah = String(id).padStart(3, '0');
                const paddedAyah = String(i).padStart(3, '0');
                const audioUrl = `https://everyayah.com/data/Alafasy_128kbps/${paddedSurah}${paddedAyah}.mp3`;
                const translationText = urduAyahs[index] ? urduAyahs[index].text : '';

                const words = ayah.text.split(" ");
                const wrappedWordsHtml = words.map((word, wIdx) => `<span class="word" id="ayah-${i}-word-${wIdx}">${word}</span>`).join(" ");

                const isBookmarked = bookmarks.some(b => b.surahId === parseInt(id) && b.ayahNo === i);

                const card = document.createElement('div');
                card.className = 'ayah-card';
                card.innerHTML = `
                    <div class="ayah-header-row">
                        <div class="ayah-number">Ayat No: ${i}</div>
                        <button class="bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" id="bm-btn-${id}-${i}" onclick="toggleBookmark(${id}, ${i}, ${JSON.stringify(ayah.text).replace(/"/g, '&quot;')})">${isBookmarked ? '★' : '☆'}</button>
                    </div>
                    <div class="ayah-arabic" id="ayah-text-${i}" style="font-size: ${arabicFontSize}rem;">${wrappedWordsHtml}</div>
                    
                    <div id="feedback-container-${i}"></div>

                    <div class="ayah-translation">ترجمہ: ${translationText}</div>
                    
                    <div class="audio-player-box">
                        <button class="play-btn" onclick="toggleAudio('${audioUrl}', this)">▶</button>
                        <div class="time-info">0:00 / 0:05</div>
                        <div class="progress-bar-container" onclick="seekAudio(event, this)">
                            <div class="progress-bar-fill"></div>
                        </div>
                        <span style="color:#94a3b8">🔊</span>
                    </div>

                    <div class="voice-rec-section">
                        <div class="mic-row">
                            <button class="mic-btn" onclick="verifyRecitationWithStrictErrors(${i}, ${JSON.stringify(words).replace(/"/g, '&quot;')})">🎤 تلاوت ریکارڈ کریں</button>
                            <span style="font-size: 0.85rem; color: #94a3b8;">تلاوت بول کر تصدیق کریں کہ کون سا حصہ درست ہے</span>
                        </div>
                        <p id="rec-result-${i}" class="rec-result">مائیک دبا کر تلاوت کی تصدیق کریں...</p>
                    </div>
                `;
                ayahsContainer.appendChild(card);
            });
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function toggleAudio(url, btn) {
            if (currentAudio && currentPlayBtn === btn) {
                if (currentAudio.paused) { currentAudio.play(); btn.textContent = '❚❚'; }
                else { currentAudio.pause(); btn.textContent = '▶'; }
                return;
            }
            if (currentAudio) { currentAudio.pause(); if (currentPlayBtn) currentPlayBtn.textContent = '▶'; }

            currentAudio = new Audio(url);
            currentPlayBtn = btn;
            const playerBox = btn.closest('.audio-player-box');
            const timeInfo = playerBox.querySelector('.time-info');
            const fillBar = playerBox.querySelector('.progress-bar-fill');

            currentAudio.play().then(() => { btn.textContent = '❚❚'; }).catch(e => console.error(e));
            currentAudio.ontimeupdate = () => {
                if (currentAudio.duration) {
                    fillBar.style.width = `${(currentAudio.currentTime / currentAudio.duration) * 100}%`;
                    timeInfo.textContent = `${formatTime(currentAudio.currentTime)} / ${formatTime(currentAudio.duration)}`;
                }
            };
            currentAudio.onended = () => { btn.textContent = '▶'; fillBar.style.width = '0%'; currentAudio = null; currentPlayBtn = null; };
        }

        function seekAudio(event, container) {
            if (!currentAudio) return;
            const rect = container.getBoundingClientRect();
            currentAudio.currentTime = ((event.clientX - rect.left) / rect.width) * currentAudio.duration;
        }

        function cleanArabicText(text) {
            if (!text) return "";
            return text.replace(/[\u0617-\u061A\u064B-\u0652]/g, "").trim();
        }

        function verifyRecitationWithStrictErrors(ayahNo, targetWords) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const resultP = document.getElementById(`rec-result-${ayahNo}`);
            const feedbackContainer = document.getElementById(`feedback-container-${ayahNo}`);

            targetWords.forEach((_, wIdx) => {
                const wordSpan = document.getElementById(`ayah-${ayahNo}-word-${wIdx}`);
                if (wordSpan) wordSpan.classList.remove('error-highlight');
            });
            feedbackContainer.innerHTML = '';

            if (!SpeechRecognition) {
                alert("براؤزر وائس ریکگنیشن کو سپورٹ نہیں کرتا۔ براہ کرم Google Chrome استعمال کریں۔");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            resultP.textContent = "سن رہے ہیں... تلاوت جاری رکھیں 🎙️";

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript.trim();
                const spokenWords = spokenText.split(" ").map(w => cleanArabicText(w));

                let matchedIndices = new Set();

                targetWords.forEach((tWord, tIdx) => {
                    const cleanTWord = cleanArabicText(tWord);
                    const isMatch = spokenWords.some(sWord => sWord === cleanTWord);
                    if (isMatch) {
                        matchedIndices.add(tIdx);
                    }
                });

                let missingOrWrongWords = [];

                targetWords.forEach((tWord, wIdx) => {
                    if (!matchedIndices.has(wIdx)) {
                        const wordSpan = document.getElementById(`ayah-${ayahNo}-word-${wIdx}`);
                        if (wordSpan) {
                            wordSpan.classList.add('error-highlight');
                            missingOrWrongWords.push(tWord);
                        }
                    }
                });

                const accuracyPercent = Math.round((matchedIndices.size / targetWords.length) * 100);

                if (missingOrWrongWords.length > 0) {
                    let feedbackHtml = `
                        <div class="feedback-box">
                            <span style="color:#f87171; font-weight:600; font-size:0.9rem;">⚠️ اعراب و تلفظ کی غلطی (Error Detected):</span>
                            <div style="margin-top: 5px; color:var(--text-main); font-size:0.85rem;">آپ نے جو آواز بولی: <strong style="color:var(--accent-color);">${spokenText}</strong></div>
                    `;
                    
                    missingOrWrongWords.forEach(errWord => {
                        feedbackHtml += `
                            <div class="error-detail-row">
                                <div>
                                    <span>❌ اس لفظ میں غلطی ہے یا درست ادا نہیں ہوا: <b style="color:#f87171;">${errWord}</b></span><br>
                                    <span class="pronunciation-tip">💡 درست طریقہ: اس لفظ کو حرکات اور مخارج کے مطابق درست پڑھیں۔</span>
                                </div>
                                <div>
                                    <span>✅ صحیح لفظ: <b style="color:#4ade80;">${errWord}</b></span>
                                </div>
                            </div>
                        `;
                    });
                    feedbackHtml += `</div>`;
                    feedbackContainer.innerHTML = feedbackHtml;
                }

                if (accuracyPercent === 100) {
                    resultP.innerHTML = `✅ <span style="color:#4ade80; font-weight:600;">ماشاءاللہ! تلاوت بالکل درست ہے (Tilawat bilkul sahi hai)۔</span>`;
                } else {
                    resultP.innerHTML = `⚠️ <span style="color:#f87171; font-weight:600;">غلطی پائی گئی! اوپر سرخ دائروں والے الفاظ کو درست کر کے دوبارہ تلاوت کریں۔</span>`;
                }
            };

            recognition.onerror = function(event) {
                resultP.textContent = "مائیکروفون کی اجازت نہیں ملی یا آواز ریکارڈ نہیں ہوئی۔ براہ کرم مائیک پرمیشن چیک کریں۔";
            };

            recognition.start();
        }

        window.onload = initApp;
    </script>
</body>
</html>
